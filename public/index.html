<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نظام حضور الهايبر ماركت - تسجيل الدخول</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { font-family: 'Cairo', sans-serif; }
    body {
      background: linear-gradient(135deg, #1e3a5f 0%, #0f2340 50%, #1a4080 100%);
      min-height: 100vh;
    }
    .glass-card {
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
    }
    .btn-primary {
      background: linear-gradient(135deg, #f97316, #ea580c);
      transition: all 0.3s ease;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(249,115,22,0.4); }
    .input-field {
      transition: all 0.3s ease;
      border: 2px solid #e5e7eb;
    }
    .input-field:focus { border-color: #1e3a5f; outline: none; box-shadow: 0 0 0 3px rgba(30,58,95,0.1); }
    .logo-circle {
      background: linear-gradient(135deg, #1e3a5f, #1a4080);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(30,58,95,0.4); }
      50% { box-shadow: 0 0 0 15px rgba(30,58,95,0); }
    }
    #toast {
      transition: all 0.3s ease;
      transform: translateY(-20px);
      opacity: 0;
      pointer-events: none;
    }
    #toast.show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

  <!-- Toast Notification -->
  <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 px-6 py-3 rounded-xl text-white font-semibold shadow-2xl text-sm">
    <span id="toast-msg"></span>
  </div>

  <div class="glass-card rounded-3xl p-8 w-full max-w-md">

    <!-- Header -->
    <div class="text-center mb-8">
      <div class="logo-circle w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-gray-800">نظام حضور الهايبر ماركت</h1>
      <p class="text-gray-500 text-sm mt-1">سجل دخولك للمتابعة</p>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="space-y-5">
      <!-- Username -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">اسم المستخدم</label>
        <div class="relative">
          <span class="absolute inset-y-0 right-3 flex items-center text-gray-400">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
          </span>
          <input
            type="text" id="username" name="username"
            class="input-field w-full pr-10 pl-4 py-3 rounded-xl bg-gray-50 text-gray-800"
            placeholder="أدخل اسم المستخدم" autocomplete="username" required />
        </div>
      </div>

      <!-- Password -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">كلمة المرور</label>
        <div class="relative">
          <span class="absolute inset-y-0 right-3 flex items-center text-gray-400">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
          </span>
          <input
            type="password" id="password" name="password"
            class="input-field w-full pr-10 pl-4 py-3 rounded-xl bg-gray-50 text-gray-800"
            placeholder="أدخل كلمة المرور" autocomplete="current-password" required />
          <button type="button" id="togglePass" class="absolute inset-y-0 left-3 flex items-center text-gray-400 hover:text-gray-600">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" id="eyeIcon">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="loginBtn"
        class="btn-primary w-full py-3 rounded-xl text-white font-bold text-lg shadow-lg flex items-center justify-center gap-2">
        <span id="btnText">تسجيل الدخول</span>
        <svg id="btnSpinner" class="animate-spin h-5 w-5 hidden" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
        </svg>
      </button>
    </form>

    <!-- Footer -->
    <div class="mt-8 text-center">
      <div class="flex items-center gap-2 justify-center text-xs text-gray-400">
        <span>🔒</span>
        <span>نظام آمن ومشفر</span>
      </div>
      <p class="text-xs text-gray-400 mt-1">جميع الحقوق محفوظة © 2024</p>
    </div>
  </div>

  <script src="/config.js"></script>
  <script>
    // ─── Toast ─────────────────────────────────────────────────────────────────
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toast-msg');

    function showToast(msg, type = 'success') {
      toast.className = `fixed top-5 left-1/2 -translate-x-1/2 z-50 px-6 py-3 rounded-xl text-white font-semibold shadow-2xl text-sm ${type === 'success' ? 'bg-green-500' : 'bg-red-500'}`;
      toastMsg.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3500);
    }

    // ─── Toggle Password Visibility ───────────────────────────────────────────
    document.getElementById('togglePass').addEventListener('click', () => {
      const pw = document.getElementById('password');
      pw.type = pw.type === 'password' ? 'text' : 'password';
    });

    // ─── Check if already logged in ──────────────────────────────────────────
    const existingToken = localStorage.getItem('token');
    const existingUser = localStorage.getItem('user');
    if (existingToken && existingUser) {
      const user = JSON.parse(existingUser);
      if (user.role === 'admin') window.location.href = '/admin/';
      else window.location.href = '/worker/';
    }

    // ─── Login Form Submit ────────────────────────────────────────────────────
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');
      const btnText = document.getElementById('btnText');
      const spinner = document.getElementById('btnSpinner');

      btn.disabled = true;
      btnText.textContent = 'جارٍ تسجيل الدخول...';
      spinner.classList.remove('hidden');

      try {
        const res = await fetch(API_BASE + '/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });

        const data = await res.json();

        if (data.success) {
          localStorage.setItem('token', data.data.token);
          localStorage.setItem('user', JSON.stringify(data.data.user));
          showToast('تم تسجيل الدخول بنجاح ✓', 'success');

          setTimeout(() => {
            if (data.data.user.role === 'admin') window.location.href = '/admin/';
            else window.location.href = '/worker/';
          }, 800);
        } else {
          showToast(data.message || 'خطأ في تسجيل الدخول', 'error');
          btn.disabled = false;
          btnText.textContent = 'تسجيل الدخول';
          spinner.classList.add('hidden');
        }
      } catch (err) {
        showToast('تعذر الاتصال بالخادم', 'error');
        btn.disabled = false;
        btnText.textContent = 'تسجيل الدخول';
        spinner.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
